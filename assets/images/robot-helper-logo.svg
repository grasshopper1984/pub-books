<svg xmlns="http://www.w3.org/2000/svg" width="480" height="400" viewBox="0 0 480 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">A helping hand</title>
  <desc id="desc">A cute round pink robot gently guides a human hand typing on a notebook computer with blue screen accents. The human wears a blue sleeve and a rugged digital sport watch.</desc>
  <!-- Self-contained vector artwork: transparent background, no fonts or external assets. -->
  <g stroke="#283B49" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Round pink robot with a heart, rosy cheeks, and a happy face -->
    <path d="M111 76V58"/>
    <circle cx="111" cy="48" r="11" fill="#ED91B5"/>
    <circle cx="107" cy="44" r="3" fill="#FFF" stroke="none"/>
    <ellipse cx="52" cy="134" rx="12" ry="19" fill="#ED91B5"/>
    <ellipse cx="174" cy="134" rx="12" ry="19" fill="#ED91B5"/>
    <path d="M98 182V207H128V182" fill="#FBE2ED"/>
    <path d="M76 216C48 222 42 246 50 267"/>
    <path d="M43 280Q34 266 47 262Q60 258 64 271" fill="#FBE2ED"/>
    <ellipse cx="113" cy="246" rx="47" ry="53" fill="#ED91B5"/>
    <ellipse cx="113" cy="135" rx="62" ry="59" fill="#FBE2ED"/>
    <rect x="70" y="109" width="86" height="53" rx="26.5" fill="#283B49" stroke="none"/>
    <path d="M85 130Q91 121 97 130M129 130Q135 121 141 130" stroke="#FFF" stroke-width="5"/>
    <path d="M106 141Q113 150 120 141" stroke="#FFF" stroke-width="4"/>
    <ellipse cx="84" cy="144" rx="6" ry="3.5" fill="#ED91B5" stroke="none"/>
    <ellipse cx="142" cy="144" rx="6" ry="3.5" fill="#ED91B5" stroke="none"/>
    <path d="M101 211C92 202 83 215 94 224L104 233L114 224C125 215 114 203 105 211L103 214Z" fill="#FFF" stroke="none"/>
    <!-- Notebook display -->
    <rect x="191" y="115" width="215" height="157" rx="14" fill="#E5F2F7"/>
    <rect x="205" y="129" width="187" height="127" rx="5" fill="#FFF" stroke="none"/>
    <!-- Typed characters, drawn as paths so no font is required -->
    <g stroke="#2686AE" stroke-width="6">
      <path d="M240 167L226 179L240 191M274 167L288 179L274 191M263 162L251 196"/>
      <path d="M302 191H319"/>
    </g>
    <path d="M227 221H273M287 221H311" stroke="#B7D7E5" stroke-width="5"/>
    <!-- Keyboard deck and front lip -->
    <path d="M191 272H406L437 326H151Z" fill="#E5F2F7"/>
    <path d="M151 326H437L429 339Q426 345 417 345H172Q162 345 158 337Z" fill="#FFF"/>
    <g stroke="#829DAC" stroke-width="4">
      <path d="M200 288H388M187 303H398"/>
      <path d="M215 283L208 306M240 283L235 306M265 283L263 306M291 283V306M317 283L320 306M343 283L349 306M369 283L378 306"/>
    </g>
    <path d="M268 317H324" stroke="#829DAC" stroke-width="4"/>
    <!-- Human hand: extended index finger presses a key -->
    <path d="M443 256L397 241L355 222Q346 218 339 224L319 245L292 259Q284 263 288 270Q291 276 300 273L325 263L315 280Q311 287 317 291Q323 295 328 287L341 271L333 288Q330 295 336 298Q343 302 347 294L360 274L354 290Q352 297 358 300Q365 303 369 295L380 276Q389 285 402 288L431 300Z" fill="#F2C8AA"/>
    <path d="M397 241L385 268" stroke="#B88466" stroke-width="4"/>
    <!-- Sleeve -->
    <path d="M426 248L448 255L436 309L415 301Z" fill="#2686AE"/>
    <!-- Rugged digital sport watch: ribbed strap, protective octagonal bezel -->
    <g transform="translate(403 268) rotate(16)" stroke-width="3">
      <rect x="-10" y="-29" width="20" height="61" rx="4" fill="#374A57"/>
      <path d="M-6-23H6M-6-18H6M-6 23H6M-6 28H6" stroke="#7D909B" stroke-width="2"/>
      <path d="M-18-8H-21V2H-18M18-8H21V2H18" fill="#374A57"/>
      <path d="M-11-18H11L18-11V10L11 17H-11L-18 10V-11Z" fill="#374A57"/>
      <rect x="-12" y="-10" width="24" height="20" rx="3" fill="#C6DFDA" stroke-width="2"/>
      <path d="M-8-4H-3V0H-8V5H-3M3-4H8V5H3ZM0-1V0M0 3V4" stroke="#283B49" stroke-width="1.5"/>
      <path d="M-4-14H4M-4 13H4" stroke="#ED91B5" stroke-width="2"/>
    </g>
    <!-- Robot arm reaches over to support the human index finger -->
    <path d="M155 218L211 239L275 248" stroke="#283B49" stroke-width="24"/>
    <path d="M155 218L211 239L275 248" stroke="#ED91B5" stroke-width="10"/>
    <circle cx="211" cy="239" r="12" fill="#FBE2ED" stroke-width="5"/>
    <path d="M277 237L291 239L301 249M274 255L284 263" stroke="#283B49" stroke-width="10"/>
    <path d="M277 237L291 239L301 249M274 255L284 263" stroke="#FBE2ED" stroke-width="4"/>
    <!-- A small keypress accent -->
    <path d="M278 285L273 292M287 289V297" stroke="#2686AE" stroke-width="4"/>
  </g>
</svg>
